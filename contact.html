    <section>
      <h2>Contact</h2>
      <p>お仕事のご依頼やご質問は、以下からお気軽にどうぞ。</p>

      <!-- 「mailto:」を付けると、クリックでメールソフトが開きます。
           example@example.com を自分のアドレスに変えてください -->
      <a href="mailto:example@example.com" class="button">メールを送る</a>
    </section>

    <section>
      <h2>SNS</h2>
      <!-- href="..." の中をあなたのSNSのURLに変えてください。
           target="_blank" は「新しいタブで開く」という意味です -->
      <ul class="skills">
        <li><a href="https://x.com/" target="_blank">X（旧Twitter）</a></li>
        <li><a href="https://www.instagram.com/" target="_blank">Instagram</a></li>
        <li><a href="https://github.com/" target="_blank">GitHub</a></li>
      </ul>
    </section>
